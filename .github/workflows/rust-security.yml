name: "Rust Security Audit"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2:00 AM UTC

permissions:
  contents: read

env:
  # Pinned Rust toolchain; bump deliberately (keep in step with ci.yml).
  RUST_TOOLCHAIN: 1.97.0
  # Pinned tool versions; bump deliberately. Each must be listed in the
  # install-action manifest at the pinned SHA (manifests/<tool>.json).
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.22.1

defaults:
  run:
    working-directory: path-commander

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}

    - name: Install cargo-audit
      uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
      with:
        tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}
        # Fail rather than fall back to an unverified cargo-binstall download.
        fallback: none

    # Fails the job when a vulnerability is found. Unmaintained and unsound
    # warnings do not fail cargo audit by default; cargo-deny covers the
    # unmaintained policy in the Dependency Checks job.
    - name: Run cargo audit
      run: cargo audit --json > audit-report.json

    # Runs even when the audit above failed, so the report is always kept.
    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cargo-audit-report
        path: path-commander/audit-report.json
        retention-days: 30
        if-no-files-found: ignore

    # Human-readable findings in the log when the audit failed.
    - name: Display audit results
      if: failure()
      run: cargo audit

  dependency-check:
    name: Dependency Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}

    - name: Install cargo-deny
      uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
      with:
        tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
        # Fail rather than fall back to an unverified cargo-binstall download.
        fallback: none

    # Policy lives in path-commander/deny.toml.
    - name: Check dependencies for issues
      run: cargo deny check advisories licenses bans sources
