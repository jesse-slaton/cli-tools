name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned Rust toolchain; bump deliberately.
  RUST_TOOLCHAIN: 1.97.0

defaults:
  run:
    working-directory: path-commander

jobs:
  format:
    name: Format
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: path-commander
          cache-on-failure: true

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: path-commander
          cache-on-failure: true

      - name: cargo build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

      # Same invocation as release.yml (explicit --target), so this checks the
      # binary the release ships.
      - name: cargo build --release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Verify no VC++ runtime dependency
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found via vswhere' }
          $exe = 'target\x86_64-pc-windows-msvc\release\pc.exe'
          if (-not (Test-Path $exe)) { throw "$exe not found" }
          $out = & $dumpbin /dependents $exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          $deps = $out | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.dll$' }
          # Every Windows exe imports KERNEL32; finding none means the parse failed.
          if (-not ($deps -match '^kernel32\.dll$')) { throw 'dumpbin output had no KERNEL32.dll line; the dependency parse is broken' }
          Write-Host 'Dependencies:'
          $deps | ForEach-Object { Write-Host "  $_" }
          Write-Host ("pc.exe size: {0} bytes" -f (Get-Item $exe).Length)
          # The VC++ runtime must be gone, and so must the Universal CRT: +crt-static
          # links both in, so either one here means the static runtime did not apply.
          $bad = @($deps | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vccorlib|ucrtbase|api-ms-win-crt-)' })
          if ($bad.Count -gt 0) { throw ("C runtime dependency found: " + ($bad -join ', ')) }

      # Keep the checked binary for a few days so it can be run on a clean
      # Windows machine before release. upload-artifact paths are relative to
      # the workspace, not to defaults.run.working-directory.
      - name: Upload pc.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pc-exe-${{ github.sha }}
          path: path-commander/target/x86_64-pc-windows-msvc/release/pc.exe
          if-no-files-found: error
          retention-days: 7
