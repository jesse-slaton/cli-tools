name: Release Path Commander

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild (e.g., v0.1.0). Builds and uploads the workflow artifact only; publishing happens on a tag push.'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned Rust toolchain; bump deliberately (keep in step with ci.yml).
  RUST_TOOLCHAIN: 1.97.0

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    permissions:
      # Only this job creates the release.
      contents: write
      # The SignPath action reads this run's job details and downloads the
      # unsigned workflow artifact with GITHUB_TOKEN.
      actions: read

    steps:
      # A manual run names its tag in an input; reject anything that is not a
      # plain vX.Y.Z before it reaches checkout or a shell. The input arrives
      # through env, never interpolated into the script.
      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag input '$INPUT_TAG': expected vX.Y.Z (for example v0.1.0)."
            exit 1
          fi
          # Dispatched from a tag: that tag must be the one being released.
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$INPUT_TAG" ]; then
            echo "::error::Run was dispatched from tag '$REF_NAME' but the tag input is '$INPUT_TAG'; they must match."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual run builds the named tag (fully qualified so a same-named
          # branch cannot shadow it); a tag push builds the pushed commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: path-commander

      - name: Extract version from tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        working-directory: path-commander
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      # --- Code signing (SignPath Foundation) --------------------------------
      # Runs only on a tag push, and only once the SignPath repository variables
      # exist, so releases keep working unsigned until onboarding is finished.
      # A manual dispatch never signs: it checks out a tag while the run's own
      # commit is the dispatching branch, so SignPath's origin verification
      # would not match the bytes being signed.
      - name: Upload unsigned binary for signing
        id: upload-unsigned
        if: github.event_name == 'push' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # archive: false uploads pc.exe as-is (artifact name = file name), so
          # the SignPath artifact configuration root is <pe-file>, not <zip-file>.
          path: path-commander/target/x86_64-pc-windows-msvc/release/pc.exe
          archive: false
          retention-days: 1

      - name: Submit signing request to SignPath
        id: sign
        if: steps.upload-unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          # Release signing needs a manual approval in SignPath; give the
          # approver an hour before the job gives up.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version_no_v) }}

      - name: Verify signature and swap in signed binary
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          $signed = Join-Path $PWD 'signed/pc.exe'
          if (-not (Test-Path $signed)) { throw "SignPath returned no signed/pc.exe" }
          $sig = Get-AuthenticodeSignature -FilePath $signed
          if ($sig.Status -ne 'Valid') { throw "Signature status is $($sig.Status): $($sig.StatusMessage)" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"
          Write-Host "Timestamp: $($sig.TimeStamperCertificate.Subject)"
          Copy-Item $signed 'path-commander/target/x86_64-pc-windows-msvc/release/pc.exe' -Force

      - name: Prepare release assets
        shell: bash
        env:
          VERSION_NO_V: ${{ steps.version.outputs.version_no_v }}
        run: |
          VERSION="$VERSION_NO_V"
          ARCHIVE_NAME="path-commander-${VERSION}-windows-x64"

          mkdir -p "release/${ARCHIVE_NAME}"

          # Copy binary
          cp path-commander/target/x86_64-pc-windows-msvc/release/pc.exe "release/${ARCHIVE_NAME}/"

          # Copy README if exists
          if [ -f path-commander/README.md ]; then
            cp path-commander/README.md "release/${ARCHIVE_NAME}/"
          fi

          # Copy LICENSE if it exists
          if [ -f path-commander/LICENSE ]; then
            cp path-commander/LICENSE "release/${ARCHIVE_NAME}/"
          elif [ -f LICENSE ]; then
            cp LICENSE "release/${ARCHIVE_NAME}/"
          else
            echo "This software is provided as-is." > "release/${ARCHIVE_NAME}/LICENSE.txt"
          fi

          # Create archive
          cd release
          7z a -tzip "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"/*

          # Generate SHA256 checksum
          sha256sum "${ARCHIVE_NAME}.zip" > "${ARCHIVE_NAME}.zip.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: path-commander-windows-x64
          path: |
            release/*.zip
            release/*.sha256
          retention-days: 5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Path Commander ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.sha256
          body: |
            ## Path Commander ${{ steps.version.outputs.version }}

            Windows PATH environment variable manager with TUI interface.

            ### Installation
            1. Download `path-commander-${{ steps.version.outputs.version_no_v }}-windows-x64.zip`
            2. Extract to a directory in your PATH
            3. Run `pc.exe`

            ### Verification
            Verify the download with SHA256:
            ```
            certutil -hashfile path-commander-${{ steps.version.outputs.version_no_v }}-windows-x64.zip SHA256
            ```

            ### Features
            - Visual TUI for managing PATH variables
            - Support for both USER and MACHINE paths
            - Dead path detection and cleanup
            - Duplicate path detection
            - Path normalization
            - Backup and restore functionality
            - Full mouse support
            - Directory creation for non-existent paths

            ### Requirements
            - Windows 10 or later
            - Administrator privileges for MACHINE path modifications

            ### Code signing policy
            See the [Code signing policy](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING_POLICY.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
